<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
  <script>
    document.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (!item.type.startsWith('image/')) continue;

        e.preventDefault();
        const file = item.getAsFile();
        const now = new Date();
        const filename = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}.png`;

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result.split(',')[1];

          const res = await fetch('/.netlify/functions/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename, content: base64 })
          });

          if (!res.ok) {
            console.error('업로드 실패', await res.text());
            return;
          }

          const editor = document.querySelector('[contenteditable="true"]');
          if (editor) {
            const markdown = `![image](/images/${filename})`;
            const selection = window.getSelection();
            if (selection.rangeCount) {
              const range = selection.getRangeAt(0);
              range.deleteContents();
              range.insertNode(document.createTextNode(markdown));
              editor.dispatchEvent(new Event('input', { bubbles: true }));
            }
          } else {
            console.error('에디터를 찾을 수 없음');
          }
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
